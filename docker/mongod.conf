# mongod.conf

# Where to store the data
storage:
  dbPath: /data/db
  journal:
    enabled: true

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0  # 👈 Listen on all interfaces (be careful in production)

# Enable authentication (optional)
# security:
#   authorization: enabled

# Where to write log data
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true

# Process management
processManagement:
  fork: false  # Set to true if running as a daemon (not needed in Docker)

# Set this for replica sets (optional)
# replication:
#   replSetName: rs0
